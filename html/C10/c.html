<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="javascript:history.back(-1)"> 뒤로가기</a><br>
    <a href="javascript:history.go(-1)"> 두 단계 뒤로 가기</a><br>
    <a href="javascript:history.go(-1)"> 처음으로 가기</a><br>
    <button onclick="history.back()">back()</button>
    <button onclick="history.go(-1)">go(-1)</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="openBtn">Open</button>
    <p>
        <button id="zoomOutBtn">-</button>
        <button id="originBtn">100%</button>
        <button id="zoomInBtn">+</button>
    </p>
    <p id="fontSize">14px</p>
    <div id="output"></div>

    <script>
        const output = document.querySelector("#output");
        const fontSize = document.querySelector("#fontSize");
        const originBtn = document.querySelector("#originBtn");
        const zoomOutBtn = document.querySelector("#zoomOutBtn");
        const zoomInBtn = document.querySelector("#zoomInBtn");
        const openBtn = document.querySelector("#openBtn");

        const defaultSize = 14;
        let currentSize = defaultSize;

        function setFontSize(size) {
            currentSize = size;
            output.style.fontSize = `${currentSize}px`;
            fontSize.textContent = `${currentSize}px`;
            originBtn.textContent = `${Math.round(currentSize / defaultSize * 100)}%`;
        }

        zoomOutBtn.addEventListener("click", () => {
            if (currentSize > 8) {
                setFontSize(currentSize - 1); 
            }
        });

        zoomInBtn.addEventListener("click", () => {
            if (currentSize < 30) {
                setFontSize(currentSize + 1);
            }
        });

        originBtn.addEventListener("click", () => {
            setFontSize(defaultSize);
        });

        openBtn.addEventListener("click", () => {
            let input = document.createElement("input");
            input.type = "file";
            input.accept = "text/plain";
            input.onchange = function(event) {
                let file = event.target.files[0];
                let reader = new FileReader();
                reader.onload = function() {
                    output.innerText = reader.result;
                };
                reader.readAsText(file, "utf-8");
            };
            input.click();
        });
                
        setFontSize(defaultSize);
    </script>
</body>
</html>
